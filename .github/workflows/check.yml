name: Check templates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Claude Code's local settings list approved commands, tokens and all.
      # Deleting the file later is not enough (history, forks), so it must
      # never reach a commit: checked over the whole history.
      - name: No Claude Code local settings
        run: |
          found=$(git log --all --format= --name-only -- ':(glob)**/.claude/settings.local.json' | sort -u)
          if [ -n "$found" ]; then
            echo "::error::Claude Code local settings in the history: $found. Rotate any secret in them, then remove the file from the history."
            exit 1
          fi

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      - name: XML is well-formed and complete
        shell: python
        run: |
          import glob, os, re, sys
          import xml.etree.ElementTree as ET

          base = "https://raw.githubusercontent.com/Tom-Joad/unraid-templates/main/"
          errors = []
          option = re.compile(r"--[\w-]+(?:[ =](?!--)\S+)?")
          allowed_extra = re.compile(
              r"^(--security-opt no-new-privileges|--memory=\S+|--stop-timeout \d+|--read-only"
              r"|--cap-drop ALL|--cap-add SET[UG]ID)$")
          secret = re.compile(r"TOKEN|KEY|PASSWORD|SECRET|WEBHOOK", re.I)
          ET.parse("ca_profile.xml")
          for path in sorted(glob.glob("templates/*.xml")):
              root = ET.parse(path).getroot()
              get = lambda tag: (root.findtext(tag) or "").strip()
              if root.tag != "Container" or root.get("version") != "2":
                  errors.append(f"{path}: not a v2 <Container>")
              for tag in ("Name", "Repository", "Overview", "Category", "Icon"):
                  if not get(tag):
                      errors.append(f"{path}: <{tag}> is empty")
              if not (get("Support") or get("Project")):
                  errors.append(f"{path}: needs <Support> or <Project>")
              if get("TemplateURL") != base + path:
                  errors.append(f"{path}: <TemplateURL> must be {base + path}")
              icon_path = f"icons/{os.path.basename(path)[:-4]}.png"
              if get("Icon") != base + icon_path:
                  errors.append(f"{path}: <Icon> must be {base + icon_path}")
              elif not os.path.isfile(icon_path):
                  errors.append(f"{path}: icon file {icon_path} is missing")
              if not re.fullmatch(r"ghcr\.io/tom-joad/[a-z0-9._-]+:latest", get("Repository")):
                  errors.append(f"{path}: <Repository> must be ghcr.io/tom-joad/<image>:latest")
              if get("Registry") != "https://ghcr.io":
                  errors.append(f"{path}: <Registry> must be https://ghcr.io")
              for cfg in root.iter("Config"):
                  if cfg.get("Type") != "Variable":
                      continue
                  var = cfg.get("Target") or cfg.get("Name") or ""
                  if var == "TZ":
                      errors.append(f"{path}: TZ variable (Unraid sets the time zone itself)")
                  # *_FORMAT only selects an output format (WEBHOOK_FORMAT), no secret.
                  if secret.search(var) and not var.upper().endswith("_FORMAT") and cfg.get("Mask") != "true":
                      errors.append(f"{path}: {var} holds a secret and needs Mask=\"true\"")
              app = os.path.basename(path)[:-4]
              if get("Repository") != f"ghcr.io/tom-joad/{app}:latest":
                  errors.append(f"{path}: <Repository> must be ghcr.io/tom-joad/{app}:latest (image = app = file name)")
              if get("Privileged").lower() != "false":
                  errors.append(f"{path}: <Privileged> must be false")
              # Same allowlist as Package-Defaults tools/audit.py (ALLOWED_EXTRA).
              extra = get("ExtraParams")
              for p in option.findall(extra):
                  if not allowed_extra.match(p):
                      errors.append(f"{path}: <ExtraParams> `{p}` is not in the standard")
              if option.sub("", extra).strip():
                  errors.append(f"{path}: <ExtraParams> has text that is not a --option: {extra}")
          print("\n".join(errors) or "all templates ok")
          sys.exit(1 if errors else 0)

      - name: Every list of apps names the same set
        shell: python
        run: |
          import glob, os, re, sys

          def read(path):
              with open(path, encoding="utf-8") as f:
                  return f.read()

          def names(pattern, text):
              return set(re.findall(pattern, text, re.M))

          sync = read("scripts/sync.sh")
          block = re.search(r"^APPS='(.*?)'", sync, re.M | re.S)
          sets = {
              "scripts/sync.sh (APPS)": names(r"^(\S+)\s+\S+\s+\S+$", block.group(1)) if block else set(),
              "templates/": {os.path.basename(p)[:-4] for p in glob.glob("templates/*.xml")},
              "icons/": {os.path.basename(p)[:-4] for p in glob.glob("icons/*.png")},
              "icons/src/make_icons.py (ICONS)": names(r'^\s+"([a-z0-9-]+)": \[', read("icons/src/make_icons.py")),
              "ca_profile.xml": names(r"^- \*\*([a-z0-9-]+)\*\*", read("ca_profile.xml")),
              "README.md (table)": names(r"^\| ([a-z][a-z0-9-]*) \|", read("README.md")),
          }
          options = re.search(r"options: \[(.*?)\]", read(".github/ISSUE_TEMPLATE/bug_report.yml"))
          sets["bug_report.yml (dropdown)"] = {o.strip() for o in options.group(1).split(",")} if options else set()

          want = sets["scripts/sync.sh (APPS)"]
          errors = []
          if not want:
              errors.append("no apps found in scripts/sync.sh")
          for where, found in sets.items():
              if found is want:
                  continue
              if missing := want - found:
                  errors.append(f"{where}: missing {', '.join(sorted(missing))}")
              if extra := found - want:
                  errors.append(f"{where}: not in scripts/sync.sh: {', '.join(sorted(extra))}")
          print("\n".join(errors) or f"all lists name the same {len(want)} apps")
          sys.exit(1 if errors else 0)
