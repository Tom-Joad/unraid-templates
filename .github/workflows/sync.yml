name: Sync templates

on:
  schedule:
    # Daily, to pick up template changes in the projects.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency: sync-templates

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the sync branch
      pull-requests: write  # open, update or close the pull request
      actions: write        # start the check on the sync branch
    env:
      BRANCH: sync/templates
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A project that can't be fetched must not stop the others: the script
      # copies what it can and exits non-zero; the status is checked in the
      # last step, after the pull request has been handled.
      - name: Copy the project templates
        id: copy
        run: |
          status=0
          sh scripts/sync.sh || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Open, update or close the pull request
        env:
          SYNC_STATUS: ${{ steps.copy.outputs.status }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          # Stage first: git diff ignores new (untracked) files, and -A also
          # records a template that was deleted on purpose.
          git add -A templates

          if git diff --cached --quiet; then
            echo "Templates are current."
            # With a failed project the comparison is incomplete: keep the pull request.
            if [ -n "$pr" ] && [ "$SYNC_STATUS" = 0 ]; then
              gh pr close "$pr" --delete-branch \
                --comment "The templates on main match the projects again; nothing to sync."
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Same templates as the branch already has: leave it alone, so the
          # head of a reviewed pull request doesn't change under the reviewer.
          if [ -n "$pr" ] && git fetch -q --depth=1 origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null \
            && git diff --cached --quiet "origin/$BRANCH" -- templates; then
            echo "$BRANCH already has these templates; nothing to push."
            exit 0
          fi

          git switch -c "$BRANCH"
          changed=$(git diff --cached --name-only | sed 's/^/- /')
          git commit -q -m "Sync templates from the projects" -m "$changed"
          git push -q --force origin "$BRANCH"

          # Pushes made with GITHUB_TOKEN start no workflows; a manual run
          # does, and its result shows up on the pull request's commit.
          gh workflow run check.yml --ref "$BRANCH"

          # The check started above isn't attached to the pull request, so
          # the pull request shows no checks of its own; GitHub may also list
          # a pull_request run without jobs that "failed" (an event from the
          # bot's token). The link leads to the run that counts.
          checks="https://github.com/${GITHUB_REPOSITORY}/actions/workflows/check.yml?query=branch%3A${BRANCH//\//%2F}"
          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "One or more projects changed their Unraid template. scripts/sync.sh copied them:" \
            "$changed" \
            "**Check:** the template check runs as a manual run on this branch and doesn't show up below; see [its runs]($checks). A pull_request run without jobs marked as failed can be ignored." \
            "Review the diff and merge once that check is green. Community Applications picks up the change after the merge.")
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Sync templates from the projects" --body "$body"
          fi

      - name: Fail when a project could not be synced
        if: steps.copy.outputs.status != '0'
        run: |
          echo "scripts/sync.sh could not copy every project; see the first step." >&2
          exit 1
